<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6ff">
  <meta name="description" content="Un saludo especial de Ali, acompañado de su pibble favorito.">
  <title>Ali — Hola, soy Ali</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172b4d;
      background: #eef6ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 3rem);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(107, 190, 255, .22), transparent 34rem),
        radial-gradient(ellipse at 88% 90%, rgba(127, 224, 232, .24), transparent 32rem),
        #eef6ff;
    }
    .greeting-card {
      width: min(100%, 760px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 24px 80px rgba(27, 67, 110, .13), 0 3px 12px rgba(27, 67, 110, .05);
      text-align: center;
    }
    .card-content { padding: clamp(1.5rem, 5vw, 3.25rem); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin: 0 0 1rem;
      color: #52718d;
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      width: 1.25rem;
      height: 1px;
      background: #a9c5dc;
      content: "";
    }
    h1 {
      margin: 0;
      color: #173a5e;
      font-size: clamp(2.6rem, 8vw, 5.25rem);
      font-weight: 760;
      letter-spacing: -.065em;
      line-height: 1.04;
    }
    .intro {
      margin: .85rem 0 1.8rem;
      color: #607890;
      font-size: clamp(.95rem, 2.5vw, 1.08rem);
      line-height: 1.65;
    }
    .image-frame {
      position: relative;
      width: min(100%, 500px);
      margin-inline: auto;
      padding: 8px;
      border: 1px solid #e0edf7;
      border-radius: 22px;
      background: linear-gradient(145deg, #f8fcff, #eaf5ff);
    }
    .pibble {
      display: block;
      width: 100%;
      max-height: min(56vh, 560px);
      border-radius: 15px;
      object-fit: cover;
      animation: float 3.4s ease-in-out infinite;
    }
    .music-controls { margin-top: 1.65rem; }
    .music-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: .65rem;
      padding: .8rem 1.25rem;
      border: 1px solid #1d5b8b;
      border-radius: 999px;
      background: #1d5b8b;
      color: #fff;
      font: inherit;
      font-size: .95rem;
      font-weight: 650;
      cursor: pointer;
      transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .music-button:hover { transform: translateY(-1px); background: #174b73; box-shadow: 0 8px 18px rgba(29, 91, 139, .2); }
    .music-button:active { transform: translateY(0); }
    .music-button:focus-visible { outline: 3px solid #76c6e8; outline-offset: 4px; }
    .music-note { margin: .7rem 0 0; color: #6b8195; font-size: .84rem; }
    .youtube-player { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .card-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid #edf2f7;
      color: #8294a5;
      font-size: .78rem;
      letter-spacing: .02em;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="greeting-card">
    <div class="card-content">
      <p class="eyebrow">Un saludo de Ali</p>
      <h1>Hola, soy Ali</h1>
      <p class="intro">Me alegra que estés aquí. Te presento a mi compañero favorito.</p>
      <div class="image-frame">
        <img
          class="pibble"
          src="./cce495a08594dc923d11254ea290e4c1.jpg"
          alt="Pibble con rayos alrededor, recostado sobre una manta amarilla"
        >
      </div>
      <div class="music-controls">
        <button class="music-button" type="button" id="musicButton" aria-pressed="false">
          <span aria-hidden="true">▶</span><span id="buttonLabel">Escuchar música</span>
        </button>
        <p class="music-note" id="musicNote">La música comenzará cuando pulses el botón.</p>
      </div>
      <iframe
        class="youtube-player"
        id="musicPlayer"
        title="Reproductor de música de YouTube"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
    <footer class="card-footer">Hecho con cariño · Ali</footer>
  </main>
  <script>
    const button = document.getElementById('musicButton');
    const label = document.getElementById('buttonLabel');
    const note = document.getElementById('musicNote');
    const player = document.getElementById('musicPlayer');
    const videoId = 'WTF_B_Scjd4';

    button.addEventListener('click', () => {
      const isPlaying = button.getAttribute('aria-pressed') === 'true';
      if (isPlaying) {
        player.src = '';
        label.textContent = 'Escuchar música';
        button.querySelector('[aria-hidden="true"]').textContent = '▶';
        note.textContent = 'La música comenzará cuando pulses el botón.';
        button.setAttribute('aria-pressed', 'false');
      } else {
        player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}`;
        label.textContent = 'Detener música';
        button.querySelector('[aria-hidden="true"]').textContent = '⏸';
        note.textContent = 'La música está activada.';
        button.setAttribute('aria-pressed', 'true');
      }
    });
  </script>
</body>
</html>
