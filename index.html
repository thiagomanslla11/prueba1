<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola, soy Ali</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #b9ecff, #d9f7ff);
      color: #23364a;
      font-family: system-ui, sans-serif;
    }
    main {
      padding: 3rem 4rem 2rem;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 1rem 3rem rgba(35, 54, 74, .12);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); }
    .dancer {
      display: inline-block;
      margin-top: 1rem;
      font-size: clamp(5rem, 18vw, 8rem);
      line-height: 1;
      transform-origin: center bottom;
      animation: dance .65s ease-in-out infinite alternate;
    }
    @keyframes dance {
      0% { transform: translateY(0) rotate(-12deg) scaleX(.95); }
      50% { transform: translateY(-12px) rotate(12deg) scaleX(1.05); }
      100% { transform: translateY(0) rotate(-8deg) scaleX(.98); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dancer { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>hola soy ali</h1>
    <div class="dancer" role="img" aria-label="Pibble bailando">🐶</div>
  </main>
</body>
</html>
