<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola, soy Ali</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8d7e8, #d9e8ff);
      color: #29233a;
      font-family: system-ui, sans-serif;
    }
    main {
      padding: 3rem 4rem;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 1rem 3rem rgba(41, 35, 58, .12);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); }
  </style>
</head>
<body>
  <main>
    <h1>hola soy ali</h1>
  </main>
</body>
</html>
